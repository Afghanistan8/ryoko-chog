[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
network = "monad"
# The deploy script reads the Chog tiers built by scripts/build-tiers.mjs.
fs_permissions = [{ access = "read", path = "../packages/shared/src/tiers.json" }]
optimizer = true
optimizer_runs = 10000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 110
